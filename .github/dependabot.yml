version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ['*'] } }
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    groups:
      dev-tools: { dependency-type: development }
  - package-ecosystem: npm
    directory: /docs
    schedule: { interval: monthly }
