name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build

      # The scanner, rules, config and cleaner are a plain library; only the
      # terminal UI may depend on React and Ink.
      - name: React and Ink stay inside src/tui
        run: |
          if grep -rnE "from '(react|ink)'" src --include='*.ts' --include='*.tsx' | grep -v '^src/tui/'; then
            echo "::error::react/ink imported outside src/tui/"
            exit 1
          fi

      - name: Smoke test the built CLI
        run: node scripts/smoke.mjs
