name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 ships npm >= 11.5.1, which trusted publishing requires.
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile

      # The full gate, so a tag can never publish something CI would reject.
      - run: bun run check

      # Authenticates with GitHub's OIDC identity (npm "Trusted Publisher" for
      # release.yml); no token is stored. Provenance is attached automatically.
      - run: npm publish --access public
