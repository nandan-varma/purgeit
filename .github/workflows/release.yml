name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24 ships npm >= 11.5.1, which trusted publishing (OIDC) requires.
          node-version: 24
          cache: npm

      - run: npm ci

      # Full verify before publish — prepublishOnly is belt-and-suspenders for
      # local `npm publish`, but the workflow must not rely on it alone.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Authenticates with GitHub's OIDC identity (npm "Trusted Publisher" for
      # release.yml); no token is stored. Provenance is attached automatically.
      - run: npm publish --access public
